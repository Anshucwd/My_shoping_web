<!DOCTYPE html>

<html>

<head>

    <title>ZOVYA_Gift_Sign_In</title>

    <style>

        body {
            margin: 0;
            background-image: url("images/Login_page.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            height: 100vh;
        }

        /* Home Button */
        .home-button {
            position: absolute;
            top: 30px;
            left: 30px;
        }

        .home-button button {
            font-size: 16px;
            padding: 8px 15px;
            cursor: pointer;
        }

        /* Sign In Box */
        .Sign_In-box {
            text-align: center;
            padding-top: 100px;
        }

    </style>

</head>


<body>

    <!-- Home Button -->

    <div class="home-button">

        <a href="ZOVYA.HTML">
            <button>🏠 Home</button>
        </a>

    </div>


    <!-- Create Account -->

    <div class="Sign_In-box">

        <div>

            <img src="images/logo.png"
                 width="100"
                 height="100"
                 style="border-radius: 50%;">

            <h1>Create Account to ZOVYA_Gifts</h1>

        </div>


        <br>


        <input type="text"
               placeholder="Enter your name"
               style="width: 250px; font-size: 15px;">


        <br><br>


        <input type="email"
               placeholder="Enter your Email"
               style="width: 250px; font-size: 15px;">


        <br><br>


        <input type="text"
               placeholder="Enter your phone number"
               style="width: 250px; font-size: 15px;">


        <br><br>


        <input type="password"
               placeholder="Create a password"
               style="width: 250px; font-size: 15px;">


        <br><br>


        <button>Submit</button>

    </div>

</body>

</html>
