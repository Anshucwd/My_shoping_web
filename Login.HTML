<!DOCTYPE html>

<html>

<head>
    <title>ZOVYA_Gifts_Login</title>

    <style>

        body {
            margin: 0;
            background-image: url("images/Login_page.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            height: 100vh;
           }

        .login-box {
            text-align: center;
            padding-top: 150px;
        }
        .home-button button {
            font-size: 16px;
            padding: 8px 15px;
            cursor: pointer;
                           }

        /* Home Button */
        .home-button {
            position: absolute;
            top: 40px;
            left: 40px;
        }

    </style>

</head>

<body>
      <div>
        
      </div>
    <div class="home-button">
        <a href="ZOVYA.HTML">
            <button>🏠 Home</button>
        </a>
    </div>

    <div class="login-box">

        <img src="images/logo.png"
             width="100"
             height="100"
             style="border-radius: 50%;">

        <h1>Login to ZOVYA_Gifts</h1>

        <input type="text"
               placeholder="Enter your Email or Phone number"
               style="width: 250px; font-size: 15px;">

        <br><br>

        <input type="password"
               placeholder="Enter your Password"
               style="width: 250px; font-size: 15px;">

        <br><br>

        <button>Login</button>

    </div>

</html>
