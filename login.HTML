<!DOCTYPE html>

<html>

<head>
    <title>ZOVYA Login</title>

    <style>

        body {
            margin: 0;
            background-image: url("images/Login_page.avif");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            height: 100vh;
        }

        .login-box
            {
            text-align: center;
             padding-top: 100px;
            }

    </style>

</head>

<body>
      <div class="login-box">

        <img src="images/logo.png"
             width="100"
             height="100"
             style="border-radius: 50%;">

        <h1>Login to ZOVYA</h1>

        <input type="text"
               placeholder="Enter your Email or Phone number"
               style="width: 250px; font-size: 15px;">

        <br><br>

        <input type="password"
               placeholder="Enter your Password"
               style="width: 250px; font-size: 15px;">

        <br><br>

        <button>Login</button>

    </div>
     <div><a href="ZOVYA.HTML"><button>🏠Home</button> </a> |</div>
